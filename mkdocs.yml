site_name: RRAP Data Generator
use_directory_urls: false
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Usage: cli-usage.md
  - Modules:
      - DHW: modules/dhw.md
      - Cyclones: modules/cyclones.md
      - Domain: modules/domain.md
      - Coral Cover: modules/coral-cover.md
      - Data Store: modules/data-store.md
      - Template: modules/template.md
      - Format: modules/format.md
      - Data Packages: modules/data-packages.md
  - Development:
      - Metadata: development.md

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
